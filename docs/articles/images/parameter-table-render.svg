<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Parameter Table box -->
  <rect x="30" y="10" width="500" height="100" rx="10" ry="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
  <text x="280" y="36" text-anchor="middle" fill="#0369a1" font-size="15" font-family="sans-serif" font-weight="700">参数表（Parameter Table）</text>
  <text x="55" y="60" fill="#0c4a6e" font-size="13" font-family="monospace">{{TEST_CMD}} = mvn test / pytest / go test / npm test</text>
  <text x="55" y="78" fill="#0c4a6e" font-size="13" font-family="monospace">{{LINT_CMD}} = mvn checkstyle / ruff / go vet / eslint</text>
  <text x="55" y="96" fill="#0c4a6e" font-size="13" font-family="monospace">{{BUILD_CMD}} = mvn compile / pip install / go build</text>

  <!-- Left arrow: 读取 (upwards) -->
  <line x1="120" y1="165" x2="120" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="148" text-anchor="end" fill="#64748b" font-size="12" font-family="sans-serif">读取</text>

  <!-- Right arrow: 写入 (downwards) -->
  <line x1="440" y1="110" x2="440" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="148" text-anchor="start" fill="#64748b" font-size="12" font-family="sans-serif">写入</text>

  <!-- Template box (left) -->
  <rect x="30" y="170" width="210" height="90" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="135" y="196" text-anchor="middle" fill="#854d0e" font-size="14" font-family="sans-serif" font-weight="700">技能文件 Template</text>
  <text x="55" y="220" fill="#a16207" font-size="13" font-family="monospace">{{TEST_CMD}}</text>
  <text x="55" y="240" fill="#a16207" font-size="13" font-family="monospace">{{LINT_CMD}}</text>

  <!-- Right arrow: 渲染 -->
  <line x1="240" y1="215" x2="310" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="208" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">渲染</text>

  <!-- Rendered box (right) -->
  <rect x="320" y="170" width="210" height="90" rx="10" ry="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="425" y="196" text-anchor="middle" fill="#166534" font-size="14" font-family="sans-serif" font-weight="700">渲染后的技能文件</text>
  <text x="345" y="220" fill="#15803d" font-size="13" font-family="monospace">mvn test</text>
  <text x="345" y="240" fill="#15803d" font-size="13" font-family="monospace">mvn checkstyle</text>
</svg>