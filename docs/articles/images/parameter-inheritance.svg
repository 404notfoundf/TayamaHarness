<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Java base parameters box -->
  <rect x="10" y="10" width="500" height="95" rx="10" ry="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
  <text x="260" y="36" text-anchor="middle" fill="#0369a1" font-size="15" font-family="sans-serif" font-weight="700">Java 基础参数</text>
  <text x="35" y="60" fill="#0c4a6e" font-size="13" font-family="monospace">{{TEST_CMD}} = mvn test</text>
  <text x="35" y="78" fill="#0c4a6e" font-size="13" font-family="monospace">{{LINT_CMD}} = mvn checkstyle:check</text>
  <text x="35" y="96" fill="#0c4a6e" font-size="13" font-family="monospace">{{BUILD_CMD}} = mvn compile</text>

  <!-- Arrow -->
  <line x1="260" y1="105" x2="260" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="128" text-anchor="start" fill="#64748b" font-size="12" font-family="sans-serif">继承 + 覆盖</text>

  <!-- Spring Boot + Gradle diff block -->
  <rect x="10" y="145" width="500" height="85" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="260" y="171" text-anchor="middle" fill="#854d0e" font-size="14" font-family="sans-serif" font-weight="700">Java — Spring Boot + Gradle（差异块）</text>
  <text x="35" y="195" fill="#a16207" font-size="13" font-family="monospace">{{BUILD_CMD}} = gradle build    ← 不同</text>
  <text x="35" y="213" fill="#a16207" font-size="13" font-family="monospace">{{TEST_CMD}} = gradle test      ← 不同</text>
  <text x="35" y="228" fill="#a16207" font-size="11" font-family="sans-serif">其他参数：继承自 Java 基础参数    ← 不写</text>
</svg>