<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="500" height="380" fill="url(#bg)" rx="12"/>
  <text x="250" y="25" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700" font-family="sans-serif">安装后的 .harness/ 目录结构</text>

  <text x="30" y="50" fill="#f59e0b" font-size="12" font-weight="700" font-family="monospace">.harness/</text>

  <text x="50" y="72" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">├── agents/</text>
  <text x="70" y="90" fill="#94a3b8" font-size="10" font-family="monospace">│   └── owner.md          ← Owner Agent 定义</text>

  <text x="50" y="112" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">├── rules/</text>
  <text x="70" y="130" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── 工程结构.md          ← 包结构、命名规范</text>
  <text x="70" y="146" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── 编码规范.md          ← 代码风格、约束</text>
  <text x="70" y="162" fill="#94a3b8" font-size="10" font-family="monospace">│   └── 运行时可靠性.md      ← 健壮性要求</text>

  <text x="50" y="184" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">├── skills/</text>
  <text x="70" y="202" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── harnessing.SKILL.md       ← 渲染后的技能</text>
  <text x="70" y="218" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── coding-skill.SKILL.md</text>
  <text x="70" y="234" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── unit-test-write.SKILL.md  ← 10 个流水线技能</text>
  <text x="70" y="250" fill="#94a3b8" font-size="10" font-family="monospace">│   └── ...</text>

  <text x="50" y="272" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">├── templates/</text>
  <text x="70" y="290" fill="#94a3b8" font-size="10" font-family="monospace">│   ├── wiki/              ← ADR、业务模型模板</text>
  <text x="70" y="306" fill="#94a3b8" font-size="10" font-family="monospace">│   └── changes/           ← 变更卡模板</text>

  <text x="50" y="328" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">├── changes/</text>
  <text x="70" y="346" fill="#94a3b8" font-size="10" font-family="monospace">│   └── &lt;id&gt;/change.md  ← 变更追踪（增量）</text>

  <text x="50" y="368" fill="#60a5fa" font-size="11" font-weight="700" font-family="monospace">└── CONTEXT.md</text>
</svg>