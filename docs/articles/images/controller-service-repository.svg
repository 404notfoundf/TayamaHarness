<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Controller box -->
  <rect x="10" y="20" width="150" height="50" rx="8" ry="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="85" y="50" text-anchor="middle" fill="#0c4a6e" font-size="16" font-family="sans-serif" font-weight="700">Controller</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="45" x2="210" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service box -->
  <rect x="215" y="20" width="150" height="50" rx="8" ry="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="290" y="50" text-anchor="middle" fill="#0c4a6e" font-size="16" font-family="sans-serif" font-weight="700">Service</text>

  <!-- Arrow 2 -->
  <line x1="365" y1="45" x2="415" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Repository box -->
  <rect x="420" y="20" width="150" height="50" rx="8" ry="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="495" y="50" text-anchor="middle" fill="#0c4a6e" font-size="16" font-family="sans-serif" font-weight="700">Repository</text>

  <!-- Constraint text -->
  <rect x="100" y="100" width="420" height="36" rx="6" ry="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="310" y="124" text-anchor="middle" fill="#dc2626" font-size="14" font-family="sans-serif">Controller 不得直接访问 Repository</text>
</svg>