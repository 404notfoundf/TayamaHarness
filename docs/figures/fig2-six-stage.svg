<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="490" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Harness Engineering · 6 阶段流水线</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">每个阶段停一次、交接一次 · 每阶段有独立验收</text>

  <!-- 输入 → ①  箭头 y=240 -->
  <polyline points="100,240 120,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="120,235 120,245 128,240" fill="#38bdf8"/>

  <!-- ① → ② -->
  <polyline points="220,240 235,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="235,235 235,245 243,240" fill="#38bdf8"/>
  <!-- ② → ③ -->
  <polyline points="335,240 350,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="350,235 350,245 358,240" fill="#38bdf8"/>
  <!-- ③ → ④ -->
  <polyline points="450,240 465,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="465,235 465,245 473,240" fill="#a855f7"/>
  <!-- ④ → ⑤ -->
  <polyline points="565,240 580,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="580,235 580,245 588,240" fill="#a855f7"/>
  <!-- ⑤ → ⑥ -->
  <polyline points="680,240 695,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="695,235 695,245 703,240" fill="#a855f7"/>
  <!-- ⑥ → 上线 -->
  <polyline points="795,240 815,240" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <polygon points="815,235 815,245 823,240" fill="#22c55e"/>

  <!-- 输入框 -->
  <g transform="translate(20,180)">
    <rect width="80" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="40" y="34" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">🎯 需求</text>
    <text x="40" y="60" text-anchor="middle" fill="#cbd5e1" font-size="10">/harnessing</text>
    <text x="40" y="82" text-anchor="middle" fill="#cbd5e1" font-size="10">一句话</text>
    <text x="40" y="102" text-anchor="middle" fill="#475569" font-size="10">—</text>
  </g>

  <!-- 6 阶段：w=100, h=280, y=100 -->
  <!-- Stage 1 -->
  <g transform="translate(120,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">① harnessing</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">需求拷问</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 规格书</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ AC ≥3 条</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 明确边界</text>
    <text x="10" y="152" fill="#475569" font-size="10">一次一问</text>
    <text x="10" y="170" fill="#475569" font-size="10">决策树</text>
    <text x="10" y="188" fill="#475569" font-size="10">边界 ≥3</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 人确认</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(235,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">② coding-skill</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">编码实现</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 逐 AC</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ Red-Green</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 垂直切片</text>
    <text x="10" y="152" fill="#475569" font-size="10">一次循环</text>
    <text x="10" y="170" fill="#475569" font-size="10">一次重构</text>
    <text x="10" y="188" fill="#475569" font-size="10">不批量</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 编译过</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(350,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">③ unit-test-write</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">单测编写</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ AC 一测试</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 覆盖率 ≥80%</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 不测 happy</text>
    <text x="10" y="152" fill="#475569" font-size="10">边界优先</text>
    <text x="10" y="170" fill="#475569" font-size="10">异常优先</text>
    <text x="10" y="188" fill="#475569" font-size="10">契约优先</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 全绿</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(465,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">④ expert-reviewer</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">专家评审</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ Spec 轴</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ Standards 轴</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 双轴并行</text>
    <text x="10" y="152" fill="#475569" font-size="10">0 个 🔴</text>
    <text x="10" y="170" fill="#475569" font-size="10">才放行</text>
    <text x="10" y="188" fill="#475569" font-size="10">红点返工</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 双轴过</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(580,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">⑤ unit-test-ci</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">CI 门禁</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ lint</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 竞态检测</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 架构约束</text>
    <text x="10" y="152" fill="#475569" font-size="10">任一失败</text>
    <text x="10" y="170" fill="#475569" font-size="10">即红灯</text>
    <text x="10" y="188" fill="#475569" font-size="10">机械化</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 机械化</text>
  </g>

  <!-- Stage 6 -->
  <g transform="translate(695,100)">
    <rect width="100" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">⑥ deploy-verify</text>
    <text x="50" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">部署验证</text>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 冒烟测试</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 健康检查</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 链路验证</text>
    <text x="10" y="152" fill="#475569" font-size="10">CI 绿 ≠</text>
    <text x="10" y="170" fill="#475569" font-size="10">线上可用</text>
    <text x="10" y="188" fill="#475569" font-size="10">含回滚</text>
    <text x="50" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 生产就绪</text>
  </g>

  <!-- 上线框 -->
  <g transform="translate(815,180)">
    <rect width="125" height="120" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="62" y="34" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">🚀 上线</text>
    <text x="62" y="60" text-anchor="middle" fill="#cbd5e1" font-size="10">变更卡归档</text>
    <text x="62" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">知识回流</text>
    <text x="62" y="100" text-anchor="middle" fill="#cbd5e1" font-size="10">CONTEXT.md</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(20,410)">
    <rect width="920" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="26" fill="#fbbf24" font-size="12" font-weight="600">⚠ 每一阶段都需"人签字"或"机器验证"才进入下一阶段</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11">阶段产物落 .harness/changes/&lt;id&gt;/  →  可审计、可回溯、可交接给下一个人</text>
  </g>
</svg>
