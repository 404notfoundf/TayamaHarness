<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="490" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Harness Engineering · 6 阶段流水线</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">每个阶段停一次、交接一次 · 每阶段有独立验收</text>

  <!-- 8 个元素：需求 → ① → ② → ③ → ④ → ⑤ → ⑥ → 上线 -->
  <!-- 需求 20-110 | ① 140-250 | ② 280-390 | ③ 420-530 | ④ 560-670 | ⑤ 700-810 | ⑥ 840-950 -->
  <!-- 全部箭头用统一风格：polyline + polygon + 上方标签 -->

  <!-- 需求 → ① -->
  <polyline points="110,240 132,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="132,235 132,245 140,240" fill="#38bdf8"/>
  <text x="121" y="230" text-anchor="middle" fill="#fbbf24" font-size="10">触发</text>

  <!-- ① → ② -->
  <polyline points="250,240 272,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="272,235 272,245 280,240" fill="#38bdf8"/>
  <text x="261" y="230" text-anchor="middle" fill="#fbbf24" font-size="10">交付</text>

  <!-- ② → ③ -->
  <polyline points="390,240 412,240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="412,235 412,245 420,240" fill="#38bdf8"/>
  <text x="401" y="230" text-anchor="middle" fill="#fbbf24" font-size="10">逐 AC</text>

  <!-- ③ → ④ -->
  <polyline points="530,240 552,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="552,235 552,245 560,240" fill="#a855f7"/>
  <text x="541" y="230" text-anchor="middle" fill="#c084fc" font-size="10">评审</text>

  <!-- ④ → ⑤ -->
  <polyline points="670,240 692,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="692,235 692,245 700,240" fill="#a855f7"/>
  <text x="681" y="230" text-anchor="middle" fill="#c084fc" font-size="10">门禁</text>

  <!-- ⑤ → ⑥ -->
  <polyline points="810,240 832,240" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="832,235 832,245 840,240" fill="#a855f7"/>
  <text x="821" y="230" text-anchor="middle" fill="#c084fc" font-size="10">部署</text>

  <!-- ⑥ → 上线 -->
  <polyline points="950,240 972,240" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <polygon points="972,235 972,245 980,240" fill="#22c55e"/>
  <!-- 上线框 x=1000，超出 viewBox。改为：上线放到右下 -->
  <!-- 改为：最后一支箭头指向右下方的上线框 -->
  <polyline points="895,382 895,415" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <polygon points="890,415 900,415 895,423" fill="#22c55e"/>

  <!-- 需求 -->
  <g transform="translate(20,180)">
    <rect width="90" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="34" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">🎯 需求</text>
    <text x="45" y="60" text-anchor="middle" fill="#cbd5e1" font-size="10">/harnessing</text>
    <text x="45" y="82" text-anchor="middle" fill="#cbd5e1" font-size="10">一句话</text>
    <text x="45" y="102" text-anchor="middle" fill="#475569" font-size="10">—</text>
  </g>

  <!-- 6 阶段：w=110, h=280, y=100 -->
  <!-- ① -->
  <g transform="translate(140,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700">① harnessing</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">需求拷问</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 规格书</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ AC ≥3 条</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 明确边界</text>
    <text x="10" y="152" fill="#475569" font-size="10">一次一问</text>
    <text x="10" y="170" fill="#475569" font-size="10">决策树</text>
    <text x="10" y="188" fill="#475569" font-size="10">边界 ≥3</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 人确认</text>
  </g>

  <!-- ② -->
  <g transform="translate(280,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700">② coding-skill</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">编码实现</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 逐 AC</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ Red-Green</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 垂直切片</text>
    <text x="10" y="152" fill="#475569" font-size="10">一次循环</text>
    <text x="10" y="170" fill="#475569" font-size="10">一次重构</text>
    <text x="10" y="188" fill="#475569" font-size="10">不批量</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 编译过</text>
  </g>

  <!-- ③ -->
  <g transform="translate(420,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700">③ unit-test-write</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">单测编写</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ AC 一测试</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 覆盖率 ≥80%</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 不测 happy</text>
    <text x="10" y="152" fill="#475569" font-size="10">边界优先</text>
    <text x="10" y="170" fill="#475569" font-size="10">异常优先</text>
    <text x="10" y="188" fill="#475569" font-size="10">契约优先</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 全绿</text>
  </g>

  <!-- ④ -->
  <g transform="translate(560,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="700">④ expert-reviewer</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">专家评审</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ Spec 轴</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ Standards 轴</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 双轴并行</text>
    <text x="10" y="152" fill="#475569" font-size="10">0 个 🔴</text>
    <text x="10" y="170" fill="#475569" font-size="10">才放行</text>
    <text x="10" y="188" fill="#475569" font-size="10">红点返工</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 双轴过</text>
  </g>

  <!-- ⑤ -->
  <g transform="translate(700,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="700">⑤ unit-test-ci</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">CI 门禁</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ lint</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 竞态检测</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 架构约束</text>
    <text x="10" y="152" fill="#475569" font-size="10">任一失败</text>
    <text x="10" y="170" fill="#475569" font-size="10">即红灯</text>
    <text x="10" y="188" fill="#475569" font-size="10">机械化</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 机械化</text>
  </g>

  <!-- ⑥ -->
  <g transform="translate(840,100)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="28" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="700">⑥ deploy-verify</text>
    <text x="55" y="48" text-anchor="middle" fill="#e2e8f0" font-size="11">部署验证</text>
    <line x1="12" y1="62" x2="98" y2="62" stroke="#334155"/>
    <text x="10" y="84" fill="#cbd5e1" font-size="10">→ 冒烟测试</text>
    <text x="10" y="102" fill="#cbd5e1" font-size="10">→ 健康检查</text>
    <text x="10" y="120" fill="#cbd5e1" font-size="10">→ 链路验证</text>
    <text x="10" y="152" fill="#475569" font-size="10">CI 绿 ≠</text>
    <text x="10" y="170" fill="#475569" font-size="10">线上可用</text>
    <text x="10" y="188" fill="#475569" font-size="10">含回滚</text>
    <text x="55" y="256" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">✅ 生产就绪</text>
  </g>

  <!-- 上线（放在 ⑥ 下方） -->
  <g transform="translate(830,420)">
    <rect width="115" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">🚀 上线</text>
    <text x="65" y="44" text-anchor="middle" fill="#cbd5e1" font-size="10">归档 · 回流</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(20,420)">
    <rect width="780" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="26" fill="#fbbf24" font-size="12" font-weight="600">⚠ 每一阶段都需"人签字"或"机器验证"才进入下一阶段</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11">阶段产物落 .harness/changes/&lt;id&gt;/  →  可审计、可回溯、可交接</text>
  </g>
</svg>
