<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, 'Microsoft YaHei', monospace">
  <rect width="960" height="480" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">.harness/ 落地结构</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">哪些进 git · 哪些可选 · 一份"项目交付审计记录"</text>

  <!-- 左侧：目录树。宽度严格控制在 x=40 到 x=540 之间 -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" transform="translate(40,105)">
    <text x="0"   y="0"   fill="#e2e8f0" font-weight="700">.harness/</text>

    <text x="15"  y="24" fill="#22c55e">├── agents/</text>
    <text x="30"  y="44" fill="#22c55e">│   └── owner.md</text>
    <text x="170" y="44" fill="#fbbf24" font-size="11">📌 必须进 git</text>

    <text x="15"  y="72" fill="#22c55e">├── rules/</text>
    <text x="30"  y="92" fill="#22c55e">│   ├── SDD-TDD模式.md</text>
    <text x="30"  y="112" fill="#22c55e">│   ├── 编码规范.md</text>
    <text x="30"  y="132" fill="#22c55e">│   ├── 工程结构.md</text>
    <text x="30"  y="152" fill="#22c55e">│   ├── 开发流程规范.md</text>
    <text x="30"  y="172" fill="#22c55e">│   └── 运行时可靠性.md</text>
    <text x="180" y="172" fill="#fbbf24" font-size="11">📌 必须进 git · 5 条</text>

    <text x="15"  y="200" fill="#22c55e">├── skills/</text>
    <text x="30"  y="220" fill="#22c55e">│   ├── java/</text>
    <text x="30"  y="240" fill="#22c55e">│   ├── golang/</text>
    <text x="30"  y="260" fill="#22c55e">│   └── common/</text>
    <text x="180" y="260" fill="#fbbf24" font-size="11">📌 必须进 git · 30+</text>

    <text x="15"  y="288" fill="#22c55e">├── wiki/</text>
    <text x="30"  y="308" fill="#22c55e">│   ├── 业务模型.md</text>
    <text x="30"  y="328" fill="#22c55e">│   ├── 接口协议.md</text>
    <text x="30"  y="348" fill="#22c55e">│   └── 架构决策.md</text>
    <text x="180" y="348" fill="#fbbf24" font-size="11">📌 必须进 git</text>

    <text x="15"  y="376" fill="#22c55e">├── CONTEXT.md</text>
    <text x="180" y="376" fill="#fbbf24" font-size="11">📌 必须进 git</text>

    <text x="15"  y="404" fill="#94a3b8">├── changes/</text>
    <text x="180" y="404" fill="#94a3b8" font-size="11">⚠ 看团队习惯</text>

    <text x="15"  y="432" fill="#94a3b8">└── iterations/</text>
    <text x="180" y="432" fill="#94a3b8" font-size="11">⚠ 看团队习惯</text>
  </g>

  <!-- 右侧：为什么必须进 git -->
  <g transform="translate(580,105)">
    <rect width="340" height="350" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">为什么要进 git</text>
    <line x1="30" y1="46" x2="310" y2="46" stroke="#334155"/>

    <text x="20" y="76" fill="#fbbf24" font-size="12" font-weight="700">① 换会话不失忆</text>
    <text x="30" y="98" fill="#cbd5e1" font-size="11">AI 每次对话先读</text>
    <text x="30" y="116" fill="#cbd5e1" font-size="11">CONTEXT.md + Owner Agent</text>

    <text x="20" y="148" fill="#fbbf24" font-size="12" font-weight="700">② 换人不重做</text>
    <text x="30" y="170" fill="#cbd5e1" font-size="11">队友 clone 下来</text>
    <text x="30" y="188" fill="#cbd5e1" font-size="11">.harness/ 已经在 · 直接上手</text>

    <text x="20" y="220" fill="#fbbf24" font-size="12" font-weight="700">③ 可审计</text>
    <text x="30" y="242" fill="#cbd5e1" font-size="11">wiki/ADR 记录决策</text>
    <text x="30" y="260" fill="#cbd5e1" font-size="11">changes/ 记录变更</text>
    <text x="30" y="278" fill="#cbd5e1" font-size="11">rules/ 记录规范演进</text>

    <text x="20" y="310" fill="#fbbf24" font-size="12" font-weight="700">④ 进 git ≠ 缓存</text>
    <text x="30" y="332" fill="#cbd5e1" font-size="11">按"审计记录"对待</text>
  </g>

  <!-- 底部结论：y=455（离 viewBox 底部 25px），两行之间分开 -->
  <g transform="translate(40,448)">
    <text x="0" y="0" fill="#22c55e" font-size="12" font-weight="700">✅ 前 5 项必须进 git</text>
    <text x="0" y="22" fill="#94a3b8" font-size="12">⚠ 后 2 项看团队习惯</text>
  </g>
</svg>
