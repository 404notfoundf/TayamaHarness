<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="480" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Owner Agent：AI 和这个项目之间的"合同"</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">.harness/agents/owner.md · 由 /apply-harness 参数化渲染 · 每个项目一份</text>

  <!-- 三个框：AI 对话 / Owner Agent / 项目 -->
  <!-- 箭头 y=260 -->
  <!-- 对话 → Owner -->
  <polyline points="240,260 360,260" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="360,255 360,265 368,260" fill="#38bdf8"/>
  <text x="300" y="250" text-anchor="middle" fill="#fbbf24" font-size="11">约束注入</text>

  <!-- Owner → 项目 -->
  <polyline points="600,260 720,260" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <polygon points="720,255 720,265 728,260" fill="#22c55e"/>
  <text x="660" y="250" text-anchor="middle" fill="#4ade80" font-size="11">落地代码</text>

  <!-- 左：AI 对话 -->
  <g transform="translate(40,140)">
    <rect width="200" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">🤖 AI 对话</text>
    <text x="100" y="60" text-anchor="middle" fill="#cbd5e1" font-size="11">/harnessing</text>
    <text x="100" y="82" text-anchor="middle" fill="#cbd5e1" font-size="11">/coding-skill</text>
    <text x="100" y="104" text-anchor="middle" fill="#cbd5e1" font-size="11">/expert-reviewer</text>
    <text x="100" y="126" text-anchor="middle" fill="#cbd5e1" font-size="11">/unit-test-ci</text>
    <line x1="20" y1="150" x2="180" y2="150" stroke="#334155"/>
    <text x="100" y="182" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">每次对话先读</text>
    <text x="100" y="208" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">Owner Agent</text>
    <text x="100" y="230" text-anchor="middle" fill="#94a3b8" font-size="10">再决定怎么干活</text>
  </g>

  <!-- 中：Owner Agent -->
  <g transform="translate(380,110)">
    <rect width="200" height="300" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">🧠 Owner Agent</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="10">.harness/agents/owner.md</text>
    <line x1="20" y1="64" x2="180" y2="64" stroke="#22c55e" stroke-width="1"/>

    <text x="16" y="90" fill="#fbbf24" font-size="11" font-weight="700">• 你是谁</text>
    <text x="30" y="108" fill="#cbd5e1" font-size="10">应用负责人智能体</text>

    <text x="16" y="134" fill="#fbbf24" font-size="11" font-weight="700">• 你的语言栈</text>
    <text x="30" y="152" fill="#cbd5e1" font-size="10">Java 21 + Spring Boot</text>

    <text x="16" y="178" fill="#fbbf24" font-size="11" font-weight="700">• 构建命令</text>
    <text x="30" y="196" fill="#cbd5e1" font-size="10">mvn compile / test</text>

    <text x="16" y="222" fill="#fbbf24" font-size="11" font-weight="700">• 架构分层</text>
    <text x="30" y="240" fill="#cbd5e1" font-size="10">Ctrl → Service → Repo</text>

    <text x="16" y="266" fill="#fbbf24" font-size="11" font-weight="700">• 规则 / 技能</text>
    <text x="30" y="284" fill="#cbd5e1" font-size="10">5 条 rules · 30+ skills</text>
  </g>

  <!-- 右：项目 -->
  <g transform="translate(740,140)">
    <rect width="200" height="240" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">📦 项目</text>
    <text x="100" y="60" text-anchor="middle" fill="#cbd5e1" font-size="11">prd-ingestion-server</text>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#334155"/>
    <text x="100" y="104" text-anchor="middle" fill="#cbd5e1" font-size="11">src/ 业务代码</text>
    <text x="100" y="124" text-anchor="middle" fill="#cbd5e1" font-size="11">test/ 测试代码</text>
    <text x="100" y="144" text-anchor="middle" fill="#cbd5e1" font-size="11">pom.xml</text>
    <line x1="20" y1="164" x2="180" y2="164" stroke="#334155"/>
    <text x="100" y="190" text-anchor="middle" fill="#fbbf24" font-size="11">AI 按约束写</text>
    <text x="100" y="210" text-anchor="middle" fill="#22c55e" font-size="11">机器按检查验</text>
    <text x="100" y="230" text-anchor="middle" fill="#94a3b8" font-size="10">人类只签验收</text>
  </g>

  <!-- 底部结论：y=435（离 viewBox 底部 25px） -->
  <g transform="translate(40,440)">
    <rect width="880" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="26" fill="#fbbf24" font-size="12" font-weight="700">没有 Owner Agent → AI 是通用助手</text>
    <text x="330" y="26" fill="#f8fafc" font-size="12">有 Owner Agent → AI 是这个项目的"专属负责人"</text>
  </g>
</svg>
