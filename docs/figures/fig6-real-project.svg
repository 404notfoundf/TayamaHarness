<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="460" fill="#0f172a" rx="16"/>
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">实演：在 prd-ingestion-server 上跑一遍</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">需求："给 PRD 导入接口加文件类型白名单" · Spring Boot 3.4.4 · Java 21 · MinIO · MySQL</text>

  <!-- 步骤 1 -->
  <g transform="translate(40,100)">
    <rect width="160" height="320" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="30" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">① 需求 · harnessing</text>
    <text x="15" y="60" fill="#fbbf24" font-size="10" font-weight="600">3 条 AC：</text>
    <text x="25" y="80" fill="#cbd5e1" font-size="10">• 白名单外 → 400</text>
    <text x="25" y="98" fill="#cbd5e1" font-size="10">+ FILE_TYPE_NOT_ALLOWED</text>
    <text x="25" y="126" fill="#cbd5e1" font-size="10">• 白名单内 (docx/pdf/doc)</text>
    <text x="25" y="144" fill="#cbd5e1" font-size="10">→ 入 MinIO + 落 DB</text>
    <text x="25" y="172" fill="#cbd5e1" font-size="10">• 非法类型 → WARN 日志</text>
    <text x="25" y="190" fill="#cbd5e1" font-size="10">+ traceId</text>
    <line x1="15" y1="210" x2="145" y2="210" stroke="#334155"/>
    <text x="15" y="232" fill="#475569" font-size="10">产物：规格说明书</text>
    <text x="15" y="250" fill="#475569" font-size="10">.harness/changes/001/</text>
    <text x="80" y="298" text-anchor="middle" fill="#22c55e" font-size="11">✅ 人确认</text>
  </g>

  <path d="M210,260 L260,260" stroke="#38bdf8" stroke-width="3" marker-end="url(#s1)"/>
  <defs><marker id="s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker></defs>

  <!-- 步骤 2 -->
  <g transform="translate(270,100)">
    <rect width="160" height="320" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="30" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">② 编码 · coding-skill</text>
    <text x="15" y="60" fill="#fbbf24" font-size="10" font-weight="600">逐 AC 实现：</text>
    <text x="25" y="82" fill="#cbd5e1" font-size="10">先红：写失败单测</text>
    <text x="25" y="102" fill="#cbd5e1" font-size="10">再绿：最小实现</text>
    <text x="25" y="122" fill="#cbd5e1" font-size="10">重构：抽出 validator</text>
    <text x="25" y="148" fill="#475569" font-size="10">垂直切片</text>
    <text x="25" y="166" fill="#475569" font-size="10">不批量</text>
    <line x1="15" y1="190" x2="145" y2="190" stroke="#334155"/>
    <text x="15" y="212" fill="#475569" font-size="10">涉及文件：</text>
    <text x="25" y="232" fill="#cbd5e1" font-size="10">ImportValidator.java</text>
    <text x="25" y="250" fill="#cbd5e1" font-size="10">FileTypeAllowList</text>
    <text x="80" y="298" text-anchor="middle" fill="#22c55e" font-size="11">✅ 编译过</text>
  </g>

  <path d="M440,260 L490,260" stroke="#38bdf8" stroke-width="3" marker-end="url(#s1)"/>

  <!-- 步骤 3 -->
  <g transform="translate(500,100)">
    <rect width="160" height="320" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="30" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">③ 单测 · unit-test-write</text>
    <text x="15" y="60" fill="#fbbf24" font-size="10" font-weight="600">AC → 测试：</text>
    <text x="25" y="82" fill="#cbd5e1" font-size="10">3 个白名单外 (.exe/.bat/.js)</text>
    <text x="25" y="102" fill="#cbd5e1" font-size="10">3 个白名单内 (.docx/.pdf/.doc)</text>
    <text x="25" y="122" fill="#cbd5e1" font-size="10">1 个边界 (大小写敏感)</text>
    <text x="25" y="148" fill="#475569" font-size="10">覆盖率 ≥ 80%</text>
    <text x="25" y="166" fill="#475569" font-size="10">不测 happy path</text>
    <line x1="15" y1="190" x2="145" y2="190" stroke="#334155"/>
    <text x="15" y="212" fill="#475569" font-size="10">命令：</text>
    <text x="25" y="232" fill="#22c55e" font-size="10">mvn test -Dtest=ImportValidatorTest</text>
    <text x="80" y="298" text-anchor="middle" fill="#22c55e" font-size="11">✅ 全绿</text>
  </g>

  <path d="M670,260 L720,260" stroke="#38bdf8" stroke-width="3" marker-end="url(#s1)"/>

  <!-- 步骤 4-6 -->
  <g transform="translate(730,100)">
    <rect width="190" height="320" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">④⑤⑥ 评审+CI+部署</text>
    <text x="15" y="60" fill="#fbbf24" font-size="10" font-weight="600">专家评审：</text>
    <text x="25" y="80" fill="#cbd5e1" font-size="10">Spec 轴 + Standards 轴</text>
    <text x="25" y="98" fill="#22c55e" font-size="10">0 个 🔴 才放行</text>

    <text x="15" y="128" fill="#fbbf24" font-size="10" font-weight="600">CI 门禁：</text>
    <text x="25" y="148" fill="#cbd5e1" font-size="10">mvn checkstyle:check</text>
    <text x="25" y="166" fill="#cbd5e1" font-size="10">mvn pmd:check</text>
    <text x="25" y="184" fill="#cbd5e1" font-size="10">mvn verify</text>

    <text x="15" y="214" fill="#fbbf24" font-size="10" font-weight="600">部署验证：</text>
    <text x="25" y="234" fill="#cbd5e1" font-size="10">POST /api/prd/upload</text>
    <text x="25" y="252" fill="#cbd5e1" font-size="10">.exe → 返回 400</text>
    <text x="25" y="270" fill="#cbd5e1" font-size="10">.docx → MinIO 落库</text>
    <text x="25" y="288" fill="#cbd5e1" font-size="10">/actuator/health → UP</text>
    <text x="95" y="312" text-anchor="middle" fill="#22c55e" font-size="11">✅ 上线</text>
  </g>

  <!-- 底部：最终落地 -->
  <g transform="translate(40,440)">
    <rect width="880" height="10" rx="2" fill="#22c55e" opacity="0.3"/>
    <text x="440" y="26" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">最终：1 句需求 → 6 阶段 → 变更卡归档 → 知识回流 CONTEXT.md → 迭代复盘</text>
  </g>
</svg>
