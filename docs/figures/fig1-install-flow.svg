<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="400" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">一行命令到底装了什么</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">npx skills@latest add git@gitcode.com:huazaiteam/huazai-harness-skills.git</text>

  <!-- 5 个框 w=150 间距 60，箭头段 60。左右各 15 padding -->
  <!-- 拉包 15–165 | ① 225–375 | ② 435–585 | ③ 645–795 | ④ 855–945 -->
  <!-- 箭头统一 y=225，标签 y=212 -->

  <!-- 箭头 1：拉包 → ① -->
  <polyline points="165,225 217,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="217,220 217,230 225,225" fill="#38bdf8"/>
  <text x="191" y="212" text-anchor="middle" fill="#fbbf24" font-size="10">触发</text>

  <!-- 箭头 2：① → ② -->
  <polyline points="375,225 427,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="427,220 427,230 435,225" fill="#38bdf8"/>
  <text x="401" y="212" text-anchor="middle" fill="#fbbf24" font-size="10">注入</text>

  <!-- 箭头 3：② → ③ -->
  <polyline points="585,225 637,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="637,220 637,230 645,225" fill="#38bdf8"/>
  <text x="611" y="212" text-anchor="middle" fill="#fbbf24" font-size="10">渲染</text>

  <!-- 箭头 4：③ → ④ -->
  <polyline points="795,225 847,225" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <polygon points="847,220 847,230 855,225" fill="#f59e0b"/>
  <text x="821" y="212" text-anchor="middle" fill="#fbbf24" font-size="10">注册</text>

  <!-- 拉包 -->
  <g transform="translate(15,150)">
    <rect width="150" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="30" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">📥 npx 拉包</text>
    <text x="75" y="58" text-anchor="middle" fill="#cbd5e1" font-size="11">拉取仓库</text>
    <text x="75" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">解到根目录</text>
    <text x="75" y="102" text-anchor="middle" fill="#cbd5e1" font-size="11">生成 .harness/</text>
    <text x="75" y="130" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">⏱ 约 30 秒</text>
  </g>

  <!-- ① 识别 -->
  <g transform="translate(225,150)">
    <rect width="150" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">① 识别语言</text>
    <text x="75" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">扫 pom.xml</text>
    <text x="75" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">go.mod</text>
    <text x="75" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">Cargo.toml</text>
    <text x="75" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">composer.json</text>
    <text x="75" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">pyproject.toml</text>
    <text x="75" y="142" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">120+ 框架</text>
  </g>

  <!-- ② 读名 -->
  <g transform="translate(435,150)">
    <rect width="150" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">② 读项目名</text>
    <text x="75" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">artifactId</text>
    <text x="75" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">package.name</text>
    <text x="75" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">go.mod module</text>
    <text x="75" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">[project] name</text>
    <text x="75" y="128" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="75" y="142" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">自动填充</text>
  </g>

  <!-- ③ 渲染 -->
  <g transform="translate(645,150)">
    <rect width="150" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">③ 渲染模板</text>
    <text x="75" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">owner.md</text>
    <text x="75" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">30+ 参数</text>
    <text x="75" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">10 技能模板</text>
    <text x="75" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">rules 合并</text>
    <text x="75" y="128" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="75" y="142" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">专属负责人</text>
  </g>

  <!-- ④ 注册 -->
  <g transform="translate(855,150)">
    <rect width="90" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="28" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">④ 注册</text>
    <text x="45" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">检测 18 种</text>
    <text x="45" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">AI 工具</text>
    <text x="45" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">复制技能</text>
    <text x="45" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">到目标目录</text>
    <text x="45" y="128" fill="#475569" font-size="10">—</text>
    <text x="45" y="142" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">⚠ 命门</text>
  </g>

  <!-- 落地 通栏 -->
  <g transform="translate(15,330)">
    <rect width="930" height="55" rx="8" fill="#0f172a" stroke="#22c55e"/>
    <text x="20" y="24" fill="#4ade80" font-size="13" font-weight="700">.harness/ 落地 · 前 5 项必须进 git</text>
    <text x="20" y="44" fill="#cbd5e1" font-size="11">agents/ · rules/ · skills/ · wiki/ · CONTEXT.md  →  可审计 · 可回溯 · 可交接</text>
  </g>
</svg>
