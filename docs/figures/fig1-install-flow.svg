<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="400" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">一行命令到底装了什么</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">npx skills@latest add git@gitcode.com:huazaiteam/huazai-harness-skills.git</text>

  <!-- 连线绘制函数：从 x1 到 x2，y 固定 -->
  <!-- 入口 → ① -->
  <polyline points="220,225 260,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="260,220 260,230 268,225" fill="#38bdf8"/>

  <!-- ① → ② -->
  <polyline points="360,225 400,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="400,220 400,230 408,225" fill="#38bdf8"/>

  <!-- ② → ③ -->
  <polyline points="565,225 605,225" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="605,220 605,230 613,225" fill="#38bdf8"/>

  <!-- ③ → ④ -->
  <polyline points="770,225 810,225" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <polygon points="810,220 810,230 818,225" fill="#f59e0b"/>

  <!-- 入口框 -->
  <g transform="translate(40,150)">
    <rect width="180" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">📥 npx 拉包</text>
    <text x="90" y="60" text-anchor="middle" fill="#cbd5e1" font-size="11">拉取仓库</text>
    <text x="90" y="82" text-anchor="middle" fill="#cbd5e1" font-size="11">解到项目根目录</text>
    <text x="90" y="104" text-anchor="middle" fill="#cbd5e1" font-size="11">生成 .harness/</text>
    <text x="90" y="132" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">⏱ 约 30 秒</text>
  </g>

  <!-- 步骤 ① -->
  <g transform="translate(260,150)">
    <rect width="100" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">① 识别</text>
    <text x="50" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">扫 pom.xml</text>
    <text x="50" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">go.mod</text>
    <text x="50" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">Cargo.toml</text>
    <text x="50" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">composer.json</text>
    <text x="50" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">pyproject.toml</text>
    <text x="50" y="144" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">120+ 框架</text>
  </g>

  <!-- 步骤 ② -->
  <g transform="translate(465,150)">
    <rect width="100" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">② 读名</text>
    <text x="50" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">artifactId</text>
    <text x="50" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">package.name</text>
    <text x="50" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">go.mod module</text>
    <text x="50" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">[project] name</text>
    <text x="50" y="124" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="50" y="144" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">自动填充</text>
  </g>

  <!-- 步骤 ③ -->
  <g transform="translate(670,150)">
    <rect width="100" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="50" y="28" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">③ 渲染</text>
    <text x="50" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">owner.md</text>
    <text x="50" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">30+ 参数</text>
    <text x="50" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">10 技能模板</text>
    <text x="50" y="106" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="50" y="124" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="50" y="144" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">专属负责人</text>
  </g>

  <!-- 步骤 ④ -->
  <g transform="translate(875,150)">
    <rect width="80" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="40" y="28" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">④ 注册</text>
    <text x="40" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">检测</text>
    <text x="40" y="70" text-anchor="middle" fill="#cbd5e1" font-size="10">18 种 AI</text>
    <text x="40" y="88" text-anchor="middle" fill="#cbd5e1" font-size="10">复制技能</text>
    <text x="40" y="106" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="40" y="124" text-anchor="middle" fill="#475569" font-size="10">—</text>
    <text x="40" y="144" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">⚠ 命门</text>
  </g>

  <!-- 落地 框 -->
  <g transform="translate(30,325)">
    <rect width="900" height="60" rx="8" fill="#0f172a" stroke="#22c55e"/>
    <text x="20" y="26" fill="#4ade80" font-size="13" font-weight="700">.harness/ 落地（前 5 项必须进 git）</text>
    <text x="20" y="48" fill="#cbd5e1" font-size="11">agents/owner.md · rules/ · skills/ · wiki/ · CONTEXT.md  →  可审计、可回溯、可交接</text>
  </g>
</svg>
