<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <rect width="960" height="500" fill="#0f172a" rx="16"/>

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">跨语言骨架：方法论层 + 技术栈层</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">方法论跨语言通用 · 技术栈按语言独立 · 一个团队一套工作语言</text>

  <!-- 顶部：同一个团队 · 6 语言 -->
  <g transform="translate(40,90)">
    <rect width="880" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="26" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">同一个团队 · 同一个方法论</text>
    <g font-size="11" fill="#cbd5e1" text-anchor="middle">
      <text x="72" y="58">Java 后端</text>
      <text x="214" y="58">Go 微服务</text>
      <text x="356" y="58">Python 数据</text>
      <text x="498" y="58">Vue 3 前端</text>
      <text x="640" y="58">Rust 加速</text>
      <text x="782" y="58">PHP 遗留</text>
    </g>
  </g>

  <!-- 中：方法论层 -->
  <g transform="translate(40,190)">
    <rect width="880" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="700">方法论层 · harness-core/</text>
    <text x="20" y="46" fill="#64748b" font-size="10">跨语言通用</text>
    <g font-size="11" fill="#e2e8f0" text-anchor="middle">
      <text x="72" y="76">SDD-TDD</text>
      <text x="206" y="76">6 阶段流水线</text>
      <text x="340" y="76">变更状态机</text>
      <text x="480" y="76">人机协同协议</text>
      <text x="620" y="76">战争迷雾</text>
      <text x="760" y="76">垂直切片</text>
    </g>
    <text x="20" y="98" fill="#94a3b8" font-size="10">5 条通用规则 + 10 个流水线技能模板</text>
  </g>

  <!-- 底：技术栈层 -->
  <g transform="translate(40,315)">
    <rect width="880" height="150" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="20" y="26" fill="#22c55e" font-size="13" font-weight="700">技术栈层 · harness-{{lang}}/</text>
    <text x="20" y="46" fill="#64748b" font-size="10">语言特有</text>

    <!-- 6 个语言卡片，w=132，间距 12 -->
    <g transform="translate(20,60)">
      <rect width="132" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="66" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-java</text>
      <text x="66" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Spring Boot · Dubbo</text>
      <text x="66" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">mvn · JUnit 5</text>
    </g>
    <g transform="translate(164,60)">
      <rect width="132" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="66" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-golang</text>
      <text x="66" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Gin · go-zero · Kitex</text>
      <text x="66" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">go build · testify</text>
    </g>
    <g transform="translate(308,60)">
      <rect width="132" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="66" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-python</text>
      <text x="66" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">FastAPI · LangChain</text>
      <text x="66" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">pytest · mypy</text>
    </g>
    <g transform="translate(452,60)">
      <rect width="132" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="66" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-rust</text>
      <text x="66" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Axum · Actix · Tauri</text>
      <text x="66" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">cargo · clippy</text>
    </g>
    <g transform="translate(596,60)">
      <rect width="132" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="66" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-php</text>
      <text x="66" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Laravel · Hyperf · Yii</text>
      <text x="66" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">composer · PHPUnit</text>
    </g>
    <g transform="translate(740,60)">
      <rect width="120" height="68" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="22" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">harness-front</text>
      <text x="60" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Vue 3 · Next.js</text>
      <text x="60" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Vite · Vitest</text>
    </g>
  </g>

  <!-- 底部结论：间距加大，外框上边界 315+150=465，结论下移到 y=490 -->
  <g transform="translate(40,492)">
    <text x="0" y="0" fill="#fbbf24" font-size="12" font-weight="700">同一个流程、各自的语言细节</text>
    <text x="220" y="0" fill="#94a3b8" font-size="11">Owner Agent 和 10 个流水线技能模板，靠参数化适配不同语言</text>
  </g>
</svg>
